<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - Student Marketplace</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="description" content="Private Buyer-Seller conversations on Student Marketplace.">
</head>
<body>
  <header class="site-header">
    <div class="container navigate">
      <a class="logo" href="index.html">StudentMarket</a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a id="seller-nav-link" href="sell.html" class="hidden-when-logged-out">Sell</a>
        <a href="jobs.html">Jobs</a>
        <a id="dashboard-link" href="dashboard.html" class="hidden-when-logged-out">Dashboard</a>
        <a id="messages-link" href="messages.html" class="hidden-when-logged-out">Messages</a>
        <a href="about.html">About</a>
        <a id="auth-link" href="login.html">Login</a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
          <span class="theme-toggle-icon">🌙</span>
          <span class="theme-toggle-text">Dark</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="container messages-page" id="messages-page">
    <div class="messages-layout">
      <aside class="conversation-sidebar" aria-label="Conversations">
        <div class="panel-header">
          <h1>Messages</h1>
        </div>
        <div id="conversation-list" class="conversation-list" aria-live="polite"></div>
        <button id="conversation-load-more" class="conversation-load-more" type="button" hidden>
          Load older conversations
        </button>
      </aside>
      <section id="message-thread" class="message-thread" aria-live="polite">
        <div class="message-loading">Loading conversation...</div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 Student Marketplace</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
